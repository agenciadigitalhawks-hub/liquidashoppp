<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parabéns! Você foi selecionado!</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #ff4a01;
}

.container {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 15px 40px;
}

/* LOGO */
.logo-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    margin-top: 10px;
    margin-bottom: 20px;
}

.logo-image {
    height: 90px;
    object-fit: contain;
}

/* TEXTOS */
.main-title {
    color: #fff;
    text-align: center;
    font-weight: 900;
    font-size: 1.9rem;
    line-height: 1.2;
    margin-bottom: 20px;
    max-width: 420px;
}

.subtitle {
    color: #fff;
    text-align: center;
    font-weight: 700;
    font-size: 1.2rem;
    margin-bottom: 30px;
    max-width: 420px;
}

/* CUPOM */
.cupom-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    margin-bottom: 40px;
}

.cupom-image {
    width: 90%;
    max-width: 380px;
    height: auto;
}

/* BOTÃO */
.cta-button {
    width: 90%;
    max-width: 380px;
    height: 75px;
    border-radius: 50px;
    border: 4px solid #FFD700;
    background: linear-gradient(90deg, #FF6B35, #FF8E53, #FFD700);
    color: #fff;
    font-weight: 900;
    font-size: 1.5rem;
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    transition: 0.2s;
}

.cta-button:hover {
    transform: translateY(-2px);
}

.cta-button:active {
    transform: scale(0.98);
}

/* DESKTOP */
@media (min-width: 768px) {
    .container {
        max-width: 700px;
    }

    .logo-image {
        height: 120px;
    }

    .main-title {
        font-size: 2.6rem;
    }

    .subtitle {
        font-size: 1.6rem;
    }

    .cta-button {
        height: 95px;
        font-size: 2rem;
    }
}
</style>

</head>
<body>

<div class="container">

    <div class="logo-wrapper">
        <img src="images/logo.png" alt="Shopee" class="logo-image">
    </div>

    <h1 class="main-title">
        Parabéns! Você foi um dos 100 selecionados pela plataforma para participar da promoção de inauguração da loja oficial da Shopee dentro do app!
    </h1>

    <p class="subtitle">
        Responda o nosso questionário oficial e ganhe até 95% de desconto em diversos produtos hoje mesmo!
    </p>

    <div class="cupom-wrapper">
        <img src="images/cupom.png" alt="Cupom 95%" class="cupom-image">
    </div>

    <button class="cta-button" id="ctaBtn">
        RESPONDER AGORA
    </button>

</div>

<script>
document.getElementById("ctaBtn").addEventListener("click", function() {
    const params = window.location.search;
    window.location.href = "../mercadoli" + params;
});
</script>

<script src="/assets/tracker.js" defer></script>
</body>
</html>
